<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LifeHub 生活整合平台 (原型)</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div id="app">

  <!-- ============ 登入/註冊畫面 ============ -->
  <div id="authScreen" class="auth-wrap">
    <div class="auth-card">
      <h1>LifeHub</h1>
      <p class="sub" id="authSub">登入你的帳號，網站與 App 資料即時同步</p>

      <div id="loginForm">
        <div class="field"><label>Email</label><input type="email" id="loginEmail" placeholder="you@example.com" /></div>
        <div class="field"><label>密碼</label><input type="password" id="loginPassword" placeholder="••••••••" /></div>
        <button class="btn btn-primary" onclick="doLogin()">登入</button>
        <div class="error-msg" id="loginError"></div>
        <div class="auth-toggle">還沒有帳號？ <a onclick="toggleAuth(true)">建立新帳號</a></div>
      </div>

      <div id="registerForm" style="display:none">
        <div class="field"><label>暱稱</label><input type="text" id="regName" placeholder="怎麼稱呼你" /></div>
        <div class="field"><label>Email</label><input type="email" id="regEmail" placeholder="you@example.com" /></div>
        <div class="field"><label>密碼 (至少6碼)</label><input type="password" id="regPassword" placeholder="••••••••" /></div>
        <button class="btn btn-primary" onclick="doRegister()">建立帳號並登入</button>
        <div class="error-msg" id="regError"></div>
        <div class="auth-toggle">已經有帳號？ <a onclick="toggleAuth(false)">回登入</a></div>
      </div>
    </div>
  </div>

  <!-- ============ 主畫面 ============ -->
  <div id="shell" style="display:none; width:100%; display:flex;">
    <div class="sidebar">
      <div class="brand">Life<span>Hub</span></div>
      <div class="nav-item active" data-tab="dashboard" onclick="switchTab('dashboard')"><span class="icon">🏠</span> 我的首頁</div>
      <div class="nav-item" data-tab="stocks" onclick="switchTab('stocks')"><span class="icon">📈</span> 股票</div>
      <div class="nav-item" data-tab="travel" onclick="switchTab('travel')"><span class="icon">🚄</span> 交通與旅遊</div>
      <div class="nav-item" data-tab="diary" onclick="switchTab('diary')"><span class="icon">📔</span> 日記</div>
      <div class="nav-item" data-tab="finance" onclick="switchTab('finance')"><span class="icon">💰</span> 記帳</div>
      <div class="nav-item" data-tab="calendar" onclick="switchTab('calendar')"><span class="icon">📅</span> 行事曆</div>
      <div class="nav-item" data-tab="assistant" onclick="switchTab('assistant')"><span class="icon">🤖</span> AI 助理</div>
      <div class="nav-item" data-tab="settings" onclick="switchTab('settings')"><span class="icon">⚙️</span> 個人化設定</div>
      <div class="sidebar-footer">
        v<span id="appVersion">-</span> · <a onclick="showDebug()">系統狀態</a>
      </div>
    </div>

    <div class="main">
      <div class="topbar">
        <h2 id="pageTitle">我的首頁</h2>
        <div class="user-chip">
          <div class="avatar" id="userAvatar">?</div>
          <span id="userName"></span>
          <button class="btn btn-ghost" onclick="doLogout()">登出</button>
        </div>
      </div>

      <div id="tab-dashboard" class="tab-panel"></div>
      <div id="tab-stocks" class="tab-panel" style="display:none"></div>
      <div id="tab-travel" class="tab-panel" style="display:none"></div>
      <div id="tab-diary" class="tab-panel" style="display:none"></div>
      <div id="tab-finance" class="tab-panel" style="display:none"></div>
      <div id="tab-calendar" class="tab-panel" style="display:none"></div>
      <div id="tab-assistant" class="tab-panel" style="display:none"></div>
      <div id="tab-settings" class="tab-panel" style="display:none"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="tooltip-box" id="tooltip"></div>

<script src="/js/app.js"></script>
</body>
</html>
